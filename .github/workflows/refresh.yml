name: 更新资讯并部署

on:
  schedule:
    # GitHub 的 cron 使用 UTC。23:30 / 11:30 UTC = 北京时间 07:30 / 19:30，
    # 预留排队和运行时间，页面通常在 08:00 / 20:00 前更新好。改成每天一次：只保留 "30 23 * * *"。
    - cron: "30 23,11 * * *"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "只重新构建并部署页面，不抓取新数据"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "**/*.md"

permissions:
  contents: write # 把 data/ 提交回仓库，历史数据得以累积
  pages: write # 部署到 GitHub Pages
  id-token: write # deploy-pages 需要
  models: read # 用内置 GITHUB_TOKEN 调用 GitHub Models 生成中文摘要

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FETCH: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_fetch) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 抓取资讯并生成摘要
        if: env.FETCH == 'true'
        run: npm run refresh
        env:
          REFRESH_TRIGGER: ${{ github.event_name }}
          # GitHub 搜索 API 用它提高限额
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 默认用 GitHub Models（免费额度）；配置了 LLM_API_KEY 密钥时改用你自己的服务（如智谱 GLM）
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GITHUB_TOKEN }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://models.github.ai/inference' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-4.1-mini' }}

      - name: 提交数据
        if: env.FETCH == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据没有变化"
            exit 0
          fi
          git commit -m "data: 自动更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: 读取 Pages 配置
        id: pages
        uses: actions/configure-pages@v6

      - name: 构建静态站点
        run: npm run build:static
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

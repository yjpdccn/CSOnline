<style>
/* Header and page tabs shared with the Next.js pages (AI 日报, 投资日报): same sizes and colors as their Tailwind classes. */
:root {
  --site-bg: #f9fafb;
  --site-fg: #0b0d12;
  --site-card: #ffffff;
  --site-primary: #16181d;
  --site-primary-fg: #fafafa;
  --site-muted: #f2f3f5;
  --site-muted-fg: #656970;
  --site-border: #e1e3e6;
  --site-ring: #a1a1a1;
  --site-destructive: #e7000b;
  --site-header-bg: rgba(249, 250, 251, .85);
  --site-header-bg-blur: rgba(249, 250, 251, .7);
  --site-track: rgba(242, 243, 245, .7);
  --site-shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, .1), 0 1px 2px -1px rgba(0, 0, 0, .1);
  --site-font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC",
    "Source Han Sans SC", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
:root.dark {
  --site-bg: #090a0c;
  --site-fg: #f7f7f7;
  --site-card: #121417;
  --site-primary: #e5e5e5;
  --site-primary-fg: #171717;
  --site-muted: #222427;
  --site-muted-fg: #9b9fa5;
  --site-border: rgba(255, 255, 255, .1);
  --site-ring: #737373;
  --site-destructive: #ff6467;
  --site-header-bg: rgba(9, 10, 12, .85);
  --site-header-bg-blur: rgba(9, 10, 12, .7);
  --site-track: rgba(34, 36, 39, .7);
}
[hidden] { display: none !important; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { margin: 0; background: var(--site-bg); color: var(--site-fg); font-family: var(--site-font); }

.site-header {
  position: sticky; top: 0; z-index: 30; height: 56px; box-sizing: border-box;
  border-bottom: 1px solid var(--site-border); background: var(--site-header-bg);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  font-family: var(--site-font); line-height: 1.5;
}
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .site-header { background: var(--site-header-bg-blur); }
}
.site-header-inner { box-sizing: border-box; margin: 0 auto; display: flex; height: 100%; max-width: 72rem; align-items: center; gap: 12px; padding: 0 16px; }
.site-left { display: flex; min-width: 0; align-items: center; gap: 10px; }
.site-logo {
  display: flex; flex: none; width: 32px; height: 32px; align-items: center; justify-content: center; border-radius: 10px;
  background: linear-gradient(to bottom right, #00d492, #00bba7, #00b8db); color: #fff;
  font-size: 13px; font-weight: 700; text-decoration: none; box-shadow: var(--site-shadow-sm);
}
.site-tagline { display: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; line-height: 16px; color: var(--site-muted-fg); }
.site-right { margin-left: auto; display: flex; min-width: 0; align-items: center; gap: 6px; }

.site-nav { display: flex; flex-shrink: 0; align-items: center; gap: 2px; border-radius: 10px; background: var(--site-track); padding: 2px; }
.site-nav a {
  display: flex; align-items: center; justify-content: center; gap: 4px; border-radius: 8px; padding: 4px 8px;
  font-family: var(--site-font); font-size: 13px; line-height: 1.5; font-weight: 500; white-space: nowrap;
  color: var(--site-muted-fg); text-decoration: none; transition: color .15s, background-color .15s;
}
.site-nav a:hover { color: var(--site-fg); }
.site-nav a[aria-current="page"] { background: var(--site-bg); color: var(--site-fg); box-shadow: var(--site-shadow-sm); }
.site-nav svg { width: 12px; height: 12px; flex: none; opacity: .7; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.site-nav-inline { display: none; }
.site-nav-row { padding: 12px 16px 0; }
.site-nav.wide a { flex: 1; padding-top: 6px; padding-bottom: 6px; }

.hbtn {
  display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box;
  height: 36px; padding: 0 10px; border: 1px solid transparent; border-radius: 10px; background: transparent;
  color: var(--site-fg); font: 500 14px/1 var(--site-font); white-space: nowrap; cursor: pointer; transition: background-color .15s;
}
.hbtn:hover { background: var(--site-muted); }
.hbtn.outline { border-color: var(--site-border); background: var(--site-bg); }
.hbtn.outline:hover { background: var(--site-muted); }
.hbtn.icon { width: 36px; padding: 0; }
.hbtn:focus-visible { outline: 3px solid rgba(161, 161, 161, .5); outline-offset: 0; }
.hbtn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hbtn .sun, .dark .hbtn .moon { display: none; }
.dark .hbtn .sun { display: block; }

@media (min-width: 640px) {
  .site-header-inner { padding: 0 24px; }
  .site-right { gap: 8px; }
  .site-nav a { padding: 4px 10px; font-size: 14px; line-height: 20px; }
  .site-nav-inline { display: flex; }
  .site-nav-row { display: none; }
}
@media (min-width: 1024px) { .site-tagline { display: block; } }

<script>
(function () {
  "use strict";
  // Same setting as the Next.js pages (next-themes): localStorage "theme" is "light", "dark" or "system".
  var root = document.documentElement;
  var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function saved() { try { return localStorage.getItem("theme"); } catch (e) { return null; } }
  function apply(theme) {
    var t = theme || saved();
    var dark = t === "dark" || (t !== "light" && !!media && media.matches);
    root.classList.toggle("dark", dark);
    root.style.colorScheme = dark ? "dark" : "light";
  }
  apply();
  if (media) {
    if (media.addEventListener) media.addEventListener("change", function () { apply(); });
    else if (media.addListener) media.addListener(function () { apply(); });
  }
  window.addEventListener("storage", function (e) { if (e.key === "theme") apply(); });
  document.addEventListener("click", function (e) {
    var btn = e.target && e.target.closest ? e.target.closest("[data-theme-toggle]") : null;
    if (!btn) return;
    var next = root.classList.contains("dark") ? "light" : "dark";
    try { localStorage.setItem("theme", next); } catch (err) { /* applies to this page only */ }
    apply(next);
  });
})();
</script>

.go { width: 100%; height: 40px; border: 0; border-radius: 10px; background: var(--site-primary); color: var(--site-primary-fg); font: 500 15px var(--site-font); cursor: pointer; transition: opacity .15s; }

#msg { min-height: 20px; margin: 12px 0 0; font-size: 13px; line-height: 20px; color: var(--site-muted-fg); }

.opening { display: none; margin: 24px 0 0; font-size: 14px; color: var(--site-muted-fg); }
.auto .lock-card { display: none; }

@media (min-width: 640px) { .lock { padding-top: 72px; } }

<script>
(function () {
  "use strict";
  var KEY_NAME = "pp:" + location.pathname.replace(/index\.html$/, "");
  var payload = JSON.parse(document.getElementById("payload").textContent);
  var root = document.documentElement;
  var form = document.getElementById("f");
  var input = document.getElementById("p");
  var remember = document.getElementById("r");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");
  var eye = document.getElementById("eye");
  var subtle = window.crypto && window.crypto.subtle;

  function fromB64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function toB64(bytes) {
    var s = "";
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  // Same normalization as the encrypt script: case, spaces and dashes do not matter.
  function normalize(p) { return (p.normalize ? p.normalize("NFKC") : p).toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function say(text, bad) { msg.textContent = text; msg.className = bad ? "bad" : ""; }
  function forget() { try { localStorage.removeItem(KEY_NAME); } catch (e) { /* storage unavailable */ } }
  // A key remembered for an older encryption (another salt) cannot open this one.
  function savedKey() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY_NAME) || "null");
      return s && s.salt === payload.salt && typeof s.k === "string" ? s.k : null;
    } catch (e) { return null; }
  }
  function deriveBits(password) {
    return subtle.importKey("raw", new TextEncoder().encode(normalize(password)), "PBKDF2", false, ["deriveBits"]).then(function (base) {
      return subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: fromB64(payload.salt), iterations: payload.iter }, base, 256);
    });
  }
  function decrypt(bits) {
    return subtle.importKey("raw", bits, { name: "AES-GCM" }, false, ["decrypt"]).then(function (key) {
      return subtle.decrypt({ name: "AES-GCM", iv: fromB64(payload.iv) }, key, fromB64(payload.ct));
    });
  }
  // document.open() is ignored while this page is still being parsed, and a remembered key can
  // decrypt before that finishes, so replace the document only once this page has fully loaded.
  function reveal(plain) {
    var html = new TextDecoder().decode(plain);
    function write() {
      document.open();
      document.write(html);
      document.close();
    }
    if (document.readyState === "complete") write();
    else window.addEventListener("load", write);
  }

  if (!subtle || !window.TextEncoder || !window.TextDecoder) {
    say("这个浏览器打不开：请用最新版的 Safari、Chrome 或微信，并确认网址以 https 开头。", true);
    go.disabled = true;
    return;
  }

  var k = savedKey();
  if (k) {
    root.classList.add("auto");
    decrypt(fromB64(k)).then(reveal, function () {
      forget();
      root.classList.remove("auto");
      say("请重新输入密码。");
    });
  } else {
    forget();
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!normalize(input.value)) { say("请输入密码。", true); return; }
    go.disabled = true;
    say("正在解锁，可能要几秒……");
    deriveBits(input.value).then(function (bits) {
      return decrypt(bits).then(function (plain) {
        if (remember.checked) {
          try { localStorage.setItem(KEY_NAME, JSON.stringify({ v: 1, salt: payload.salt, k: toB64(new Uint8Array(bits)) })); } catch (e) { /* not saved */ }
        } else {
          forget();
        }
        reveal(plain);
      }, function () {
        go.disabled = false;
        say("密码不对，请再试一次。", true);
        input.select();
      });
    }, function () {
      go.disabled = false;
      say("这个浏览器解锁失败，请换用最新版的 Safari 或 Chrome。", true);
    });
  });

  eye.addEventListener("click", function () {
    var showing = input.type === "password";
    input.type = showing ? "text" : "password";
    eye.textContent = showing ? "隐藏" : "显示";
    eye.setAttribute("aria-pressed", String(showing));
    input.focus();
  });
})();
</script>

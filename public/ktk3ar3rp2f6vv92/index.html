:root { --bg: #f6f4ef; --card: #fff; --ink: #1d2329; --muted: #667085; --line: #e3ded3; --accent: #0e7c6b; --accent-ink: #fff; --bad: #b42318; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #121417; --card: #1b1f24; --ink: #e8eaed; --muted: #9aa4b2; --line: #2b3139; --accent: #3cc0a8; --accent-ink: #08201b; --bad: #ff8a80; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
form { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 22px 22px; text-align: center; }
svg { width: 44px; height: 44px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
h1 { font-size: 20px; margin: 10px 0 4px; }
p { margin: 0; }
.lead { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.pw { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.pw:focus-within { outline: 2px solid var(--accent); border-color: transparent; }
input[type="password"], input[type="text"] { flex: 1; min-width: 0; border: 0; background: transparent; color: inherit; font: inherit; font-size: 17px; padding: 12px 14px; outline: none; letter-spacing: .04em; }
.eye { border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 14px; padding: 0 14px; cursor: pointer; }
label.rm { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 14px 0 16px; font-size: 15px; color: var(--ink); cursor: pointer; }
label.rm input { width: 20px; height: 20px; accent-color: var(--accent); }
button.go { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; }
button.go:disabled { opacity: .6; cursor: default; }
#msg { min-height: 1.6em; margin-top: 12px; font-size: 14px; color: var(--muted); }
#msg.bad { color: var(--bad); }
.hint { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.user { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.opening { display: none; color: var(--muted); }
.auto form { display: none; }
.auto .opening { display: block; }
</style>

<script>
(function () {
  "use strict";
  var KEY_NAME = "pp:" + location.pathname.replace(/index\.html$/, "");
  var payload = JSON.parse(document.getElementById("payload").textContent);
  var form = document.getElementById("f");
  var input = document.getElementById("p");
  var remember = document.getElementById("r");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");
  var eye = document.getElementById("eye");
  var subtle = window.crypto && window.crypto.subtle;

  function fromB64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function toB64(bytes) {
    var s = "";
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  // Same normalization as the encrypt script: case, spaces and dashes do not matter.
  function normalize(p) { return (p.normalize ? p.normalize("NFKC") : p).toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function say(text, bad) { msg.textContent = text; msg.className = bad ? "bad" : ""; }
  function forget() { try { localStorage.removeItem(KEY_NAME); } catch (e) { /* storage unavailable */ } }
  function savedKey() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY_NAME) || "null");
      return s && s.salt === payload.salt && typeof s.k === "string" ? s.k : null;
    } catch (e) { return null; }
  }
  function deriveBits(password) {
    return subtle.importKey("raw", new TextEncoder().encode(normalize(password)), "PBKDF2", false, ["deriveBits"]).then(function (base) {
      return subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: fromB64(payload.salt), iterations: payload.iter }, base, 256);
    });
  }
  function decrypt(bits) {
    return subtle.importKey("raw", bits, { name: "AES-GCM" }, false, ["decrypt"]).then(function (key) {
      return subtle.decrypt({ name: "AES-GCM", iv: fromB64(payload.iv) }, key, fromB64(payload.ct));
    });
  }
  // document.open() is ignored while this page is still being parsed, and a remembered key can
  // decrypt before that finishes, so replace the document only once this page has fully loaded.
  function reveal(plain) {
    var html = new TextDecoder().decode(plain);
    function write() {
      document.open();
      document.write(html);
      document.close();
    }
    if (document.readyState === "complete") write();
    else window.addEventListener("load", write);
  }

  if (!subtle || !window.TextEncoder || !window.TextDecoder) {
    say("这个浏览器打不开：请用最新版的 Safari、Chrome 或微信，并确认网址以 https 开头。", true);
    go.disabled = true;
    return;
  }

  var k = savedKey();
  if (k) {
    document.documentElement.className = "auto";
    decrypt(fromB64(k)).then(reveal, function () {
      forget();
      document.documentElement.className = "";
      say("请重新输入密码。");
    });
  } else {
    forget();
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!normalize(input.value)) { say("请输入密码。", true); return; }
    go.disabled = true;
    say("正在解锁，可能要几秒……");
    deriveBits(input.value).then(function (bits) {
      return decrypt(bits).then(function (plain) {
        if (remember.checked) {
          try { localStorage.setItem(KEY_NAME, JSON.stringify({ v: 1, salt: payload.salt, k: toB64(new Uint8Array(bits)) })); } catch (e) { /* not saved */ }
        } else {
          forget();
        }
        reveal(plain);
      }, function () {
        go.disabled = false;
        say("密码不对，请再试一次。", true);
        input.select();
      });
    }, function () {
      go.disabled = false;
      say("这个浏览器解锁失败，请换用最新版的 Safari 或 Chrome。", true);
    });
  });

  eye.addEventListener("click", function () {
    var showing = input.type === "password";
    input.type = showing ? "text" : "password";
    eye.textContent = showing ? "隐藏" : "显示";
    eye.setAttribute("aria-pressed", String(showing));
    input.focus();
  });
})();
</script>
